<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thư thầy cô gửi Hội khóa</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #2b2620;
    --text: #f3ead8;
    --accent: #d9b26f;
    --mbar: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #3d352c 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; height: 100dvh; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---- Sân khấu ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  body.single #stage { bottom: calc(var(--mbar) + env(safe-area-inset-bottom)); }
  #bookWrap { position: relative; }               /* width/height do JS tính */
  body:not(.single) #bookWrap { box-shadow: 0 24px 70px rgba(0,0,0,.55); }
  body.single #bookWrap { box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #book { width: 100%; height: 100%; }

  .page { background: #fff; overflow: hidden; }
  .page img {
    width: 100%; height: 100%; display: block; object-fit: cover;
    -webkit-user-drag: none; pointer-events: none;
  }
  /* Bìa desktop: một ảnh rộng 2 trang, cắt đôi ở gáy */
  .page.half { position: relative; }
  .page.half img { position: absolute; top: 0; width: 200%; height: 100%; }
  .page.half.left  img { left: 0; }
  .page.half.right img { left: -100%; }
  /* Bìa mobile khi chỉ có title.jpg rộng 2 trang: thu vừa khung */
  .page.title-fit { background: var(--bg); display: flex; align-items: center; }
  .page.title-fit img { height: auto; object-fit: contain; }

  /* ---- Desktop: mũi tên hai bên + số trang phía dưới ---- */
  .nav {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 8;
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25);
    color: var(--text); font-size: 28px; line-height: 1; cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  .nav:hover:not(:disabled) { background: rgba(255,255,255,.15); }
  .nav:disabled, .mbtn:disabled { opacity: .25; cursor: default; }
  #prevBtn { left: 20px; }
  #nextBtn { right: 20px; }
  #info {
    position: fixed; left: 50%; bottom: max(4px, calc(2.5vh - 13px)); transform: translateX(-50%);
    z-index: 8; display: flex; align-items: center; gap: 10px;
    font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums;
  }
  .pageInput {
    width: 48px; height: 26px; text-align: center; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.3);
    color: var(--text); font-size: 13px;
  }
  #fsBtn {
    position: fixed; top: 10px; right: 14px; z-index: 8;
    background: transparent; border: none; color: var(--text);
    font-size: 20px; opacity: .6; cursor: pointer;
  }
  #fsBtn:hover { opacity: 1; }

  /* ---- Mobile: thanh điều khiển dưới đáy ---- */
  #mbar {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    height: calc(var(--mbar) + env(safe-area-inset-bottom));
    padding: 0 12px env(safe-area-inset-bottom);
    align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    font-variant-numeric: tabular-nums; font-size: 15px;
  }
  .mbtn {
    width: 44px; height: 40px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.25); background: transparent;
    color: var(--text); font-size: 22px; line-height: 1;
  }
  #mbar .mid { display: flex; align-items: center; gap: 10px; }
  body.single #mbar { display: flex; }
  body.single .nav, body.single #info, body.single #fsBtn { display: none; }

  /* ---- Loading ---- */
  #loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--bg); transition: opacity .4s;
  }
  #loader h1 { font-weight: 500; font-size: clamp(18px, 3vw, 28px); color: var(--accent); text-align: center; padding: 0 20px; }
  #progress { width: min(320px, 70vw); height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #loadText { font-size: 14px; opacity: .8; }
</style>
</head>
<body>

<div id="loader">
  <h1>Thư thầy cô gửi Hội khóa</h1>
  <div id="progress"><div></div></div>
  <div id="loadText">Đang đếm số trang…</div>
</div>

<div id="stage"><div id="bookWrap"></div></div>

<!-- Desktop -->
<button class="nav" id="prevBtn" aria-label="Trang trước">‹</button>
<button class="nav" id="nextBtn" aria-label="Trang sau">›</button>
<div id="info">
  <span class="pageInfo">Bìa</span>
  <input class="pageInput" type="number" min="0" placeholder="Tới" aria-label="Đi tới trang">
</div>
<button id="fsBtn" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>

<!-- Mobile -->
<div id="mbar">
  <button class="mbtn" id="mPrev" aria-label="Trang trước">‹</button>
  <div class="mid">
    <span class="pageInfo">Bìa</span>
    <input class="pageInput" type="number" inputmode="numeric" min="0" placeholder="Tới" aria-label="Đi tới trang">
  </div>
  <button class="mbtn" id="mNext" aria-label="Trang sau">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ================= CẤU HÌNH — chỉ cần sửa ở đây ================= */
const CONFIG = {
  folder: "img/",
  title: "title.jpg",              // bìa rộng 2 trang (desktop)
  titleMobile: "title-mobile.jpg", // tùy chọn: bìa khổ 1 trang cho mobile; không có thì dùng title.jpg thu nhỏ
  ext: "jpg",
  prefix: "",                      // ví dụ "p-" nếu ảnh tên p-01.jpg
  pad: 0,                          // 0 → 1.jpg ; 2 → 01.jpg
  start: 1,
  total: 0,                        // 0 = tự đếm ảnh trong img/
  heightPct: 0.90,                 // desktop: trang cao 90% màn hình
  mobileBreak: 768,                // rộng ≤ 768px hoặc màn dọc → 1 trang
  preloadFirst: 4
};
/* ================================================================= */

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
const wrap = $("bookWrap");
const bar = $("progress").firstElementChild;
const pageUrl = n => `${CONFIG.folder}${CONFIG.prefix}${String(CONFIG.start + n - 1).padStart(CONFIG.pad, "0")}.${CONFIG.ext}`;
const titleSrc = CONFIG.folder + CONFIG.title;

async function exists(url) {
  try { return (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; }
  catch { return false; }
}
async function countPages() {
  if (CONFIG.total > 0) return CONFIG.total;
  if (!(await exists(pageUrl(1)))) return 0;
  let lo = 1, hi = 2;
  while (await exists(pageUrl(hi))) { lo = hi; hi *= 2; if (hi > 4096) break; }
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (await exists(pageUrl(mid))) lo = mid; else hi = mid;
  }
  return lo;
}
function loadImg(src) {
  return new Promise(res => { const im = new Image(); im.onload = im.onerror = () => res(im); im.src = src; });
}

(async () => {
  const [N, mobileTitleOk] = await Promise.all([
    countPages(),
    CONFIG.titleMobile ? exists(CONFIG.folder + CONFIG.titleMobile) : false
  ]);
  if (!N) { $("loadText").textContent = "Không tìm thấy ảnh trong img/. Kiểm tra lại tên file."; return; }

  const head = [titleSrc, ...Array.from({ length: Math.min(CONFIG.preloadFirst, N) }, (_, i) => pageUrl(i + 1))];
  let done = 0;
  const imgs = await Promise.all(head.map(src => loadImg(src).then(im => {
    done++;
    bar.style.width = (done / head.length * 100) + "%";
    $("loadText").textContent = `Đang tải ${done}/${head.length} · ${N} trang`;
    return im;
  })));
  start(N, imgs[1], mobileTitleOk ? CONFIG.folder + CONFIG.titleMobile : null);
})();

function start(N, firstPage, mobileTitleSrc) {
  const pw0 = firstPage.naturalWidth, ph0 = firstPage.naturalHeight;
  const ratio = pw0 / ph0;

  let pageFlip = null, single = null;

  /* ---- Kích thước ----
     Desktop: 2 trang, cao 90% màn hình.
     Mobile : 1 trang, rộng hết màn hình (nếu quá cao thì co theo chiều cao). */
  function measure() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = vw <= CONFIG.mobileBreak || vw < vh;
    let pw, ph;
    if (s) {
      const mbar = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mbar")) || 56;
      const availH = vh - mbar - 8;
      pw = vw; ph = pw / ratio;
      if (ph > availH) { ph = availH; pw = ph * ratio; }
    } else {
      ph = vh * CONFIG.heightPct; pw = ph * ratio;
      if (pw * 2 > vw - 160) { pw = (vw - 160) / 2; ph = pw / ratio; }
    }
    return { s, pw, ph };
  }
  function applySize(m) {
    document.body.classList.toggle("single", m.s);
    wrap.style.width = Math.floor(m.s ? m.pw : m.pw * 2) + "px";
    wrap.style.height = Math.floor(m.ph) + "px";
    // ép thư viện: mobile → portrait (1 trang), desktop → landscape (2 trang)
    if (pageFlip) pageFlip.getSettings().minWidth = m.s ? Math.ceil(m.pw * 0.6) : 1;
  }

  /* ---- Ánh xạ chỉ số trang ----
     Desktop: 0,1 = hai nửa bìa; ảnh n ở index n+1.
     Mobile : 0 = bìa;           ảnh n ở index n. */
  const firstIdx = () => single ? 1 : 2;
  const toContent = idx => idx - firstIdx() + 1;
  const toIndex = n => n + firstIdx() - 1;

  function addPage(book, src, cls, alt, hard) {
    const div = document.createElement("div");
    div.className = "page" + (cls ? " " + cls : "");
    if (hard) div.dataset.density = "hard";
    const img = document.createElement("img");
    img.src = src; img.alt = alt; img.decoding = "async"; img.draggable = false;
    div.appendChild(img);
    book.appendChild(div);
  }

  function build(m, startContent) {
    if (pageFlip) { try { pageFlip.destroy(); } catch (e) {} pageFlip = null; }
    single = m.s;
    applySize(m);
    wrap.innerHTML = "";
    const book = document.createElement("div");
    book.id = "book";
    wrap.appendChild(book);

    if (single) {
      if (mobileTitleSrc) addPage(book, mobileTitleSrc, "", "Bìa", true);
      else addPage(book, titleSrc, "title-fit", "Bìa", true);
    } else {
      addPage(book, titleSrc, "half left", "Bìa (trái)", true);
      addPage(book, titleSrc, "half right", "Bìa (phải)", true);
    }
    for (let i = 1; i <= N; i++) addPage(book, pageUrl(i), "", `Trang ${i}`, false);

    pageFlip = new St.PageFlip(book, {
      width: pw0, height: ph0,
      size: "stretch",
      minWidth: single ? Math.ceil(m.pw * 0.6) : 1,
      maxWidth: 5000, minHeight: 1, maxHeight: 5000,
      showCover: false,
      usePortrait: true,
      mobileScrollSupport: false,
      maxShadowOpacity: 0.5,
      flippingTime: single ? 700 : 900,
      swipeDistance: 30
    });
    pageFlip.loadFromHTML(book.querySelectorAll(".page"));
    pageFlip.on("flip", updateUI);
    pageFlip.on("changeOrientation", updateUI);
    if (startContent > 0) pageFlip.turnToPage(toIndex(Math.min(startContent, N)));
    updateUI();
  }

  window.addEventListener("resize", () => {
    const m = measure();
    if (m.s !== single) {
      const idx = pageFlip.getCurrentPageIndex();
      build(m, idx >= firstIdx() ? toContent(idx) : 0);   // đổi chế độ → dựng lại, giữ trang đang đọc
    } else {
      applySize(m);
    }
  });

  /* ---- Điều hướng ---- */
  const total = () => pageFlip.getPageCount();
  const idxNow = () => pageFlip.getCurrentPageIndex();
  const atEnd = () => idxNow() >= total() - (single ? 1 : 2);

  function next() { atEnd() ? pageFlip.flip(0) : pageFlip.flipNext(); }   // cuối sách → về bìa
  function prev() { if (idxNow() > 0) pageFlip.flipPrev(); }              // ở bìa: không lùi

  // Kéo phải→trái ở trang cuối → về bìa (thư viện tự lo các trang còn lại)
  let sx = 0, sy = 0, sIdx = 0, tracking = false;
  function gStart(x, y) { sx = x; sy = y; sIdx = idxNow(); tracking = true; }
  function gEnd(x, y) {
    if (!tracking) return;
    tracking = false;
    const dx = x - sx, dy = y - sy;
    if (idxNow() !== sIdx) return;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0 && atEnd()) pageFlip.flip(0);
  }
  const stage = $("stage");
  stage.addEventListener("touchstart", e => gStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true, capture: true });
  stage.addEventListener("touchend",   e => gEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true, capture: true });
  stage.addEventListener("mousedown",  e => gStart(e.clientX, e.clientY), true);
  window.addEventListener("mouseup",   e => setTimeout(() => gEnd(e.clientX, e.clientY), 0), true);

  function updateUI() {
    if (!pageFlip) return;
    const idx = idxNow();
    let label;
    if (idx < firstIdx()) label = "Bìa";
    else {
      const c = toContent(idx);
      label = (!single && c < N) ? `${c}–${c + 1} / ${N}` : `${c} / ${N}`;
    }
    $$(".pageInfo").forEach(el => el.textContent = label);
    $("prevBtn").disabled = $("mPrev").disabled = idx === 0;
    history.replaceState(null, "", idx < firstIdx() ? location.pathname : "#" + toContent(idx));
  }

  $("nextBtn").onclick = $("mNext").onclick = next;
  $("prevBtn").onclick = $("mPrev").onclick = prev;
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
    if (e.key === "Home") pageFlip.flip(0);
    if (e.key === "End") pageFlip.flip(total() - 1);
  });
  $$(".pageInput").forEach(inp => {
    inp.max = N;
    inp.addEventListener("change", e => {
      const n = Math.min(Math.max(parseInt(e.target.value, 10) || 0, 0), N);
      pageFlip.flip(n === 0 ? 0 : toIndex(n));
      e.target.value = ""; e.target.blur();
    });
  });
  $("fsBtn").onclick = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  };

  // Link ...#12 → mở thẳng trang 12
  const sp = parseInt(location.hash.slice(1), 10);
  build(measure(), sp >= 1 && sp <= N ? sp : 0);

  $("loader").style.opacity = 0;
  setTimeout(() => $("loader").remove(), 400);
}
</script>
</body>
</html>
